name: Build MartX Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version
        required: true
        default: 1.0.0

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Validate protected inputs
        shell: pwsh
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          SOURCE_REPOSITORY: ${{ vars.SOURCE_REPOSITORY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPO_TOKEN)) {
            Write-Error 'SOURCE_REPO_TOKEN is not configured. Add it under Settings -> Secrets and variables -> Actions -> New repository secret.'
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPOSITORY)) {
            Write-Error 'SOURCE_REPOSITORY is not configured. Add it under Settings -> Secrets and variables -> Actions -> New repository variable with value owner/repo.'
            exit 1
          }
          Write-Host "Protected inputs present for $env:SOURCE_REPOSITORY."

      - name: Checkout installer workflow
        uses: actions/checkout@v5

      - name: Checkout private source
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        timeout-minutes: 12
        working-directory: source
        run: npm ci

      - name: Install frontend dependencies
        timeout-minutes: 10
        working-directory: source/frontend
        run: npm ci

      - name: Build source
        timeout-minutes: 10
        working-directory: source
        run: npm run build --prefix frontend

      - name: Verify frontend build output
        shell: pwsh
        run: |
          $expected = 'source\frontend\dist'
          if (-not (Test-Path -Path $expected)) {
            Write-Error "Expected build output at $expected was not found."
            Write-Host 'Available source directories:'
            Get-ChildItem -Path source -Directory | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "$expected found."

      - name: Download NSSM
        timeout-minutes: 5
        shell: pwsh
        run: |
          $version = '2.24'
          Invoke-WebRequest "https://nssm.cc/release/nssm-$version.zip" -OutFile nssm.zip
          Expand-Archive nssm.zip -DestinationPath nssm
          New-Item -ItemType Directory -Force installer/stage/service | Out-Null
          Copy-Item "nssm/nssm-$version/win64/nssm.exe" installer/stage/service/nssm.exe

      - name: Stage production runtime
        timeout-minutes: 12
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/stage/runtime | Out-Null
          Copy-Item (Get-Command node).Source installer/stage/runtime/node.exe
          powershell -ExecutionPolicy Bypass -File installer/stage-runtime.ps1 -SourceRoot (Resolve-Path source) -StageRoot (Resolve-Path installer/stage)

      - name: Install Inno Setup
        timeout-minutes: 10
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          $progFilesX86 = ${env:ProgramFiles(x86)}
          if ([string]::IsNullOrWhiteSpace($progFilesX86)) {
            Write-Error 'Could not read ProgramFiles(x86).'
            exit 1
          }
          $iscc = Join-Path $progFilesX86 'Inno Setup 6\ISCC.exe'
          Write-Host "Looking for ISCC at: $iscc"
          if (-not (Test-Path -Path $iscc)) {
            Write-Error "ISCC.exe was not found at $iscc."
            Get-ChildItem -Path $progFilesX86 -Force | Select-Object Name, PSIsContainer
            exit 1
          }
          Write-Host 'Inno Setup verified.'

      - name: Verify package contents
        run: node installer/verify-package.js installer/stage

      - name: Preflight staged Windows service
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = (Resolve-Path installer/stage).Path
          $dataRoot = Join-Path $env:RUNNER_TEMP 'martx-preflight-data'
          New-Item -ItemType Directory -Force $dataRoot | Out-Null
          try {
            powershell -NoProfile -ExecutionPolicy Bypass -File installer/install-service.ps1 `
              -InstallRoot $installRoot -DataRoot $dataRoot
            powershell -NoProfile -ExecutionPolicy Bypass -File installer/smoke-install.ps1 `
              -TimeoutSeconds 45
          } finally {
            powershell -NoProfile -ExecutionPolicy Bypass -File installer/install-service.ps1 `
              -InstallRoot $installRoot -DataRoot $dataRoot -Remove
          }

      - name: Create Windows icon
        run: node installer/create-ico.js source/logo.png installer/martx.ico

      - name: Compile installer
        timeout-minutes: 10
        shell: pwsh
        env:
          MARTX_INSTALLER_VERSION: ${{ inputs.version }}
        run: |
          $progFilesX86 = ${env:ProgramFiles(x86)}
          $iscc = Join-Path $progFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -Path $iscc)) {
            Write-Error "ISCC.exe was not found at $iscc."
            exit 1
          }
          & $iscc "/DMyAppVersion=${{ inputs.version }}" installer/MartX.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and smoke-test compiled installer
        timeout-minutes: 6
        shell: pwsh
        env:
          MARTX_INSTALLER_TEST: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem installer/output/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Compiled installer executable was not found.' }
          $installLog = Join-Path $env:RUNNER_TEMP 'martx-installer-test.log'
          try {
            Write-Host "Installing $($installer.FullName) silently."
            $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$installLog"
            ) -PassThru
            $finished = Wait-Process -Id $install.Id -Timeout 180 -ErrorAction SilentlyContinue
            if (-not $finished) {
              Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
              throw 'Installer did not exit within 180 seconds.'
            }
            $install.Refresh()
            if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }

            powershell -NoProfile -ExecutionPolicy Bypass -File installer/smoke-install.ps1 -TimeoutSeconds 45
          } catch {
            if (Test-Path $installLog) {
              Write-Host '--- Inno Setup install log ---'
              Get-Content $installLog -Tail 120
            }
            foreach ($runtimeLog in @(
              'C:\ProgramData\MartX\logs\install.log',
              'C:\ProgramData\MartX\logs\service-stdout.log',
              'C:\ProgramData\MartX\logs\service-stderr.log'
            )) {
              if (Test-Path $runtimeLog) {
                Write-Host "--- $runtimeLog ---"
                Get-Content $runtimeLog -Tail 120
              }
            }
            throw
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: MartXPOS-Windows-Installer
          path: installer/output/*.exe
          if-no-files-found: error
